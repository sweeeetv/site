# .github/workflows/test.yml
# manual trigger: 
name: Test OIDC Auth #readable, shows up in the "Actions" tab

on: # trigger. Other choices: push, pull_request, schedule (cron job), workflow_call (another workfow calls this)
  workflow_dispatch:  # manual trigger only

permissions:
  id-token: write   # allows GitHub to mint the JWT (for Azure login)
  contents: read # this jwt token can read repo contents (code, commits, tags, releases) via GitHub's API — which is what actions/checkout@v4 uses under the hood to the repo onto the runner. Without it, actions/checkout would fail.
  # this section: also can't push commits, open issues, modify PRs, or touch Actions settings. If a malicious dependency or compromised action tried to abuse the token mid-run, the blast radius is capped at "read the code," not "do anything to this GH repo."

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify access
        run: |
          az account show
          az group show --name rg-resume



          