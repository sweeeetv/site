name: Infra deployment v3


# terraform plan and show details after pr and before merge
on:
  pull_request: 
    branches: [main]
    paths:
      - 'infra/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the workflow mint the OIDC JWT for Azure
      contents: read  # lets GITHUB_TOKEN pull the repo code (checkout)
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3 #gha wrapper script of terraform not the version of terraform.

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -detailed-exitcode
        working-directory: terraform
      # - run: terraform apply -auto-approve   # or require manual approval via environment protection rules